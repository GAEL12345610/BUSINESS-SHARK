<style>
  /* Layout — fixed-stage 1920×1080. Padding interior generoso. */
  .slide-inner {
    width: 100%; height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 80px 96px;
  }

  .slide-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    display: flex; align-items: center; gap: 14px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  /* El isotipo REAL (brand/isotipo.svg). Hereda el color con currentColor:
     negro sobre claro, blanco sobre oscuro. Nunca dibujar una marca a mano. */
  .brand-mark {
    height: 34px;
    width: auto;
    color: var(--ink);
    display: block;
  }

  .slide-meta {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .slide-body {
    align-self: end;
    max-width: 1400px;
  }

  .eyebrow {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin-bottom: 24px;
  }

  .client-name {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 600;
    color: var(--ink-2);
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }

  .deck-title {
    font-family: var(--font-display);
    font-size: 104px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.03em;
    line-height: 0.98;
    margin-bottom: 40px;
  }

  .deck-subtitle {
    font-family: var(--font-body);
    font-size: 24px;
    line-height: 1.45;
    color: var(--muted);
    max-width: 880px;
  }

  .slide-footer {
    align-self: end;
    margin-top: 56px;
  }
  .footer-rule {
    height: 1px;
    background: var(--hairline);
    margin-bottom: 20px;
  }
  .footer-meta {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
  }
  .page-number { letter-spacing: 0.06em; }

  /* Caret blinking en el título */
  .caret {
    display: inline-block;
    width: 0.55em;
    height: 0.85em;
    background: var(--accent);
    margin-left: 0.15em;
    transform: translateY(0.08em);
    animation: caretBlink 1.1s steps(2) infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }

  /* Reveal staggered */
  .rv {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 1s var(--ease-out), transform 1s var(--ease-out);
  }
  .slide.active .rv { opacity: 1; transform: none; }
  .rv-delay-1 { transition-delay: 0.10s; }
  .rv-delay-2 { transition-delay: 0.22s; }
  .rv-delay-3 { transition-delay: 0.36s; }
</style>
